<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Bean — Signaturesi</title>

    <meta
      name="description"
      content="Bean is a private communication, identity and work platform by Signaturesi."
    />

    <meta name="application-name" content="Bean" />
    <meta name="theme-color" content="#ffffff" />

    <meta
      name="color-scheme"
      content="light dark"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- ======================================================
         PWA
         ====================================================== -->

    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- ======================================================
         APP ICONS
         Icons will live inside /public/icons/
         ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />

    <!-- ======================================================
         APP ENTRY
         ====================================================== -->

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </head>

  <body>
    <noscript>
      Bean requires JavaScript to run.
    </noscript>

    <div
      id="app"
      role="application"
      aria-label="Bean"
    ></div>
  </body>
</html>
